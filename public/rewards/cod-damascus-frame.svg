<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Damascus Iridescent Pattern -->
    <linearGradient id="damascusWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cyanAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan Holographic Outer Perimeter -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(34,211,238,0.3)" stroke-width="3" stroke-dasharray="10,6"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" filter="url(#cyanAura)"/>

  <!-- Damascus Steel Rim Body -->
  <path d="M 250 20 A 230 230 0 1 1 249.9 20 Z M 250 82 A 168 168 0 1 0 250.1 82 Z"
        fill="url(#damascusWave)" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Damascus Swirl Overlays -->
  <path d="M 80 120 Q 150 180 200 100 T 350 120 Q 420 80 440 180" fill="none" stroke="rgba(236,72,153,0.4)" stroke-width="6"/>
  <path d="M 60 280 Q 140 220 220 320 T 380 260 Q 440 320 420 380" fill="none" stroke="rgba(34,211,238,0.45)" stroke-width="6"/>
  <path d="M 120 400 Q 250 360 380 400" fill="none" stroke="rgba(244,114,182,0.4)" stroke-width="4"/>

  <!-- Armored Bolt Plates Top -->
  <path d="M 170 32 Q 250 18 330 32 L 320 62 Q 250 50 180 62 Z" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="190" cy="47" r="4.5" fill="#000" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="310" cy="47" r="4.5" fill="#000" stroke="#38bdf8" stroke-width="1.5"/>

  <text x="250" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#f8fafc" letter-spacing="3" text-anchor="middle">
    CALL OF DUTY
  </text>
  <text x="250" y="56" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#38bdf8" letter-spacing="2" text-anchor="middle">
    DAMASCUS // CAMO MASTERY
  </text>

  <!-- Cyan Laser Optic Slots -->
  <g filter="url(#cyanAura)">
    <rect x="42" y="210" width="8" height="40" rx="4" fill="#22d3ee"/>
    <rect x="450" y="210" width="8" height="40" rx="4" fill="#22d3ee"/>
    <circle cx="110" cy="110" r="5" fill="#38bdf8"/>
    <circle cx="390" cy="110" r="5" fill="#38bdf8"/>
    <circle cx="110" cy="390" r="5" fill="#ec4899"/>
    <circle cx="390" cy="390" r="5" fill="#ec4899"/>
  </g>

  <!-- Left Stencil Plate -->
  <path d="M 40 180 L 72 195 L 72 305 L 40 320 Z" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <text x="-250" y="58" transform="rotate(-90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#38bdf8" letter-spacing="3" text-anchor="middle">
    COMPLETIONIST // TIER 100
  </text>

  <!-- Right Stencil Plate -->
  <path d="M 460 180 L 428 195 L 428 305 L 460 320 Z" fill="#090d16" stroke="#38bdf8" stroke-width="2"/>
  <text x="250" y="-442" transform="rotate(90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#f472b6" letter-spacing="3" text-anchor="middle">
    WARZONE // MODERN WARFARE
  </text>

  <!-- Bottom Plate -->
  <path d="M 160 415 L 250 405 L 340 415 L 355 460 L 250 488 L 145 460 Z" fill="#060913" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="250" y="446" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2" text-anchor="middle" filter="url(#cyanAura)">
    DAMASCUS
  </text>
  <text x="250" y="468" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#38bdf8" letter-spacing="3" text-anchor="middle">
    APEX PRESTIGE
  </text>

  <!-- Silver Titanium Bullets (Bottom-Right) -->
  <g transform="translate(390, 340) rotate(22)">
    <rect x="0" y="15" width="12" height="42" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <polygon points="0,15 6,0 12,15" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
    <rect x="18" y="10" width="12" height="42" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
    <polygon points="18,10 24,-5 30,10" fill="#f1f5f9" stroke="#475569" stroke-width="1"/>
    <rect x="-4" y="26" width="38" height="15" rx="3" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Inner Bezel Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="#090d16" stroke-width="4"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
</svg>