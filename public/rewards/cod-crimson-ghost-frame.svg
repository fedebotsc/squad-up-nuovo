<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="crimsonMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="30%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="redLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="crimsonAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crimson Laser Perimeter Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(239,68,68,0.25)" stroke-width="4" stroke-dasharray="14,7"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#redLaser)" stroke-width="3" filter="url(#crimsonAura)"/>

  <!-- Main Matte Black Carbon Body -->
  <path d="M 250 20 A 230 230 0 1 1 249.9 20 Z M 250 82 A 168 168 0 1 0 250.1 82 Z"
        fill="url(#crimsonMetal)" stroke="#09090b" stroke-width="2"/>

  <!-- Top Plate: Ghost Task Force 141 -->
  <path d="M 170 32 Q 250 18 330 32 L 320 62 Q 250 50 180 62 Z" fill="#09090b" stroke="#ef4444" stroke-width="2"/>
  <circle cx="190" cy="47" r="4.5" fill="#18181b" stroke="#f87171" stroke-width="1.5"/>
  <circle cx="310" cy="47" r="4.5" fill="#18181b" stroke="#f87171" stroke-width="1.5"/>

  <text x="250" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fef2f2" letter-spacing="3" text-anchor="middle">
    CALL OF DUTY
  </text>
  <text x="250" y="56" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#ef4444" letter-spacing="2" text-anchor="middle">
    TASK FORCE 141 // BLOODTHIRSTY
  </text>

  <!-- Crimson Red Laser Optics -->
  <g filter="url(#crimsonAura)">
    <rect x="42" y="210" width="8" height="40" rx="4" fill="#ef4444"/>
    <rect x="450" y="210" width="8" height="40" rx="4" fill="#ef4444"/>
    <path d="M 115 78 Q 80 120 60 170" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 385 78 Q 420 120 440 170" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Left Stencil Plate -->
  <path d="M 40 180 L 72 195 L 72 305 L 40 320 Z" fill="#09090b" stroke="#ef4444" stroke-width="2"/>
  <text x="-250" y="58" transform="rotate(-90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#fca5a5" letter-spacing="3" text-anchor="middle">
    RED-DOT // SNIPER OPS
  </text>

  <!-- Right Stencil Plate -->
  <path d="M 460 180 L 428 195 L 428 305 L 460 320 Z" fill="#09090b" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="-442" transform="rotate(90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#fca5a5" letter-spacing="3" text-anchor="middle">
    GHOST PROTOCOL // TF-141
  </text>

  <!-- Bottom Plate with Ghost Skull & WARZONE -->
  <path d="M 160 415 L 250 405 L 340 415 L 355 460 L 250 488 L 145 460 Z" fill="#09090b" stroke="#ef4444" stroke-width="2.5"/>
  <text x="250" y="446" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#fef2f2" letter-spacing="2" text-anchor="middle" filter="url(#crimsonAura)">
    WARZONE
  </text>
  <text x="250" y="468" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#ef4444" letter-spacing="3" text-anchor="middle">
    CRIMSON ASSAULT
  </text>

  <!-- Hanging Dogtag (Bottom-Left) -->
  <g transform="translate(68, 335) rotate(-18)">
    <circle cx="20" cy="10" r="2.5" fill="#ef4444"/>
    <circle cx="20" cy="18" r="2.5" fill="#ef4444"/>
    <circle cx="20" cy="26" r="2.5" fill="#ef4444"/>
    <rect x="4" y="32" width="46" height="74" rx="10" fill="#09090b" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="27" cy="40" r="3.5" fill="#000" stroke="#f87171" stroke-width="1"/>
    <!-- Skull silhouette -->
    <path d="M 27 50 C 21 50 16 55 16 62 C 16 67 19 71 21 74 L 21 80 L 33 80 L 33 74 C 35 71 38 67 38 62 C 38 55 33 50 27 50 Z" fill="#f87171"/>
    <circle cx="22" cy="61" r="2" fill="#09090b"/>
    <circle cx="32" cy="61" r="2" fill="#09090b"/>
    <text x="27" y="90" font-family="'Impact', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">GHOST</text>
    <text x="27" y="100" font-family="system-ui" font-size="7" font-weight="900" fill="#ef4444" text-anchor="middle">★★★</text>
  </g>

  <!-- Bullets (Bottom-Right) -->
  <g transform="translate(390, 340) rotate(22)">
    <rect x="0" y="15" width="12" height="42" rx="2" fill="#991b1b" stroke="#ef4444" stroke-width="1"/>
    <polygon points="0,15 6,0 12,15" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
    <rect x="18" y="10" width="12" height="42" rx="2" fill="#991b1b" stroke="#ef4444" stroke-width="1"/>
    <polygon points="18,10 24,-5 30,10" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
    <rect x="-4" y="26" width="38" height="15" rx="3" fill="#09090b" stroke="#ef4444" stroke-width="1.5"/>
  </g>

  <!-- Inner Bezel Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="#18181b" stroke-width="4"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
</svg>