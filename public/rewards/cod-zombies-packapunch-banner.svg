<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="zombieBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e051a"/>
      <stop offset="40%" stop-color="#24073d"/>
      <stop offset="80%" stop-color="#120324"/>
      <stop offset="100%" stop-color="#06010a"/>
    </linearGradient>
    <linearGradient id="aetherPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="packGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#zombieBg)"/>

  <!-- Energy Arc Lighting Bolts -->
  <g stroke="#d946ef" stroke-width="2.5" fill="none" filter="url(#packGlow)" opacity="0.8">
    <path d="M 120 40 L 160 110 L 140 160 L 220 220 L 190 280 L 250 360"/>
    <path d="M 1080 40 L 1040 120 L 1070 170 L 990 240 L 1020 310 L 960 370"/>
    <path d="M 500 20 L 530 80 L 480 120 L 540 180"/>
    <path d="M 680 20 L 660 70 L 710 110 L 670 170"/>
  </g>

  <!-- Dark Aether Dimensional Core Center -->
  <circle cx="600" cy="180" r="130" fill="rgba(192,132,252,0.18)" filter="url(#packGlow)"/>
  <circle cx="600" cy="180" r="80" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="10,6"/>
  <circle cx="600" cy="180" r="45" fill="#a855f7" filter="url(#packGlow)"/>
  <circle cx="600" cy="180" r="20" fill="#f8fafc"/>

  <!-- Ray Gun Discharging Left -->
  <g transform="translate(180, 210) scale(0.9)">
    <circle cx="0" cy="0" r="45" fill="rgba(34,197,94,0.3)" filter="url(#packGlow)"/>
    <text x="0" y="8" font-family="'Impact'" font-size="28" fill="#4ade80" text-anchor="middle">⚡</text>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(600, 230)">
    <text x="0" y="-70" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#e879f9" letter-spacing="6" text-anchor="middle">
      CALL OF DUTY: BLACK OPS ZOMBIES
    </text>
    <text x="0" y="-10" font-family="'Impact', sans-serif" font-size="60" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#packGlow)">
      PACK-A-PUNCH
    </text>
    <text x="0" y="40" font-family="'Impact', sans-serif" font-size="34" font-weight="900" fill="url(#aetherPurple)" letter-spacing="8" text-anchor="middle">
      DARK AETHER OVERLOAD
    </text>
    <text x="0" y="70" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#f5d0fe" letter-spacing="4" text-anchor="middle">
      TIER III ENHANCEMENT // 115 ELEMENT ACTIVE
    </text>
  </g>

  <!-- Bottom Tactical Ribbon -->
  <g transform="translate(0, 370)">
    <polygon points="60,0 1140,0 1110,40 90,40" fill="#1b082e" stroke="#c084fc" stroke-width="2"/>
    <polygon points="75,10 95,10 85,30 65,30" fill="#d946ef"/>
    <polygon points="98,10 118,10 108,30 88,30" fill="#d946ef"/>
    <text x="135" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#f5d0fe" letter-spacing="2">
      CALL OF DUTY
    </text>
    <text x="600" y="25" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">
      SURVIVE  •  LOOT  •  WIN
    </text>
    <text x="1035" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#c084fc" letter-spacing="2">
      ZOMBIES
    </text>
    <polygon points="1075,10 1095,10 1085,30 1065,30" fill="#d946ef"/>
    <polygon points="1098,10 1118,10 1108,30 1088,30" fill="#d946ef"/>
  </g>
</svg>