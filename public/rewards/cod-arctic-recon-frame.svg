<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="arcticMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="iceCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="iceAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ice Halo Outer Perimeter -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="4" stroke-dasharray="8,6"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#iceCyan)" stroke-width="3" filter="url(#iceAura)"/>

  <!-- Frosted Titanium Rim Body -->
  <path d="M 250 20 A 230 230 0 1 1 249.9 20 Z M 250 82 A 168 168 0 1 0 250.1 82 Z"
        fill="url(#arcticMetal)" stroke="#334155" stroke-width="2.5"/>

  <!-- Top Plate: Arctic Division -->
  <path d="M 170 32 Q 250 18 330 32 L 320 62 Q 250 50 180 62 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="190" cy="47" r="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="310" cy="47" r="4.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <text x="250" y="44" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#f8fafc" letter-spacing="3" text-anchor="middle">
    CALL OF DUTY
  </text>
  <text x="250" y="56" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#38bdf8" letter-spacing="2" text-anchor="middle">
    ARCTIC RECON // SUB-ZERO
  </text>

  <!-- Ice Cyan Glow Slots -->
  <g filter="url(#iceAura)">
    <rect x="42" y="210" width="8" height="40" rx="4" fill="#38bdf8"/>
    <rect x="450" y="210" width="8" height="40" rx="4" fill="#38bdf8"/>
    <path d="M 115 78 Q 80 120 60 170" fill="none" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 385 78 Q 420 120 440 170" fill="none" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Left Stencil Plate -->
  <path d="M 40 180 L 72 195 L 72 305 L 40 320 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="-250" y="58" transform="rotate(-90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#bae6fd" letter-spacing="3" text-anchor="middle">
    FROST-BITE // SPEC-12
  </text>

  <!-- Right Stencil Plate -->
  <path d="M 460 180 L 428 195 L 428 305 L 460 320 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="250" y="-442" transform="rotate(90)" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#bae6fd" letter-spacing="3" text-anchor="middle">
    WARZONE // VERDANSK PEAK
  </text>

  <!-- Bottom Plate with WARZONE -->
  <path d="M 160 415 L 250 405 L 340 415 L 355 460 L 250 488 L 145 460 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="250" y="446" font-family="'Impact', sans-serif" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="2" text-anchor="middle" filter="url(#iceAura)">
    WARZONE
  </text>
  <text x="250" y="468" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#38bdf8" letter-spacing="3" text-anchor="middle">
    SUB-ZERO ELITE
  </text>

  <!-- Frosted Platinum Dogtag (Bottom-Left) -->
  <g transform="translate(68, 335) rotate(-18)">
    <circle cx="20" cy="10" r="2.5" fill="#38bdf8"/>
    <circle cx="20" cy="18" r="2.5" fill="#38bdf8"/>
    <circle cx="20" cy="26" r="2.5" fill="#38bdf8"/>
    <rect x="4" y="32" width="46" height="74" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="27" cy="40" r="3.5" fill="#000" stroke="#38bdf8" stroke-width="1"/>
    <text x="27" y="65" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="middle">❄</text>
    <text x="27" y="85" font-family="'Impact', sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">ARCTIC</text>
    <text x="27" y="96" font-family="system-ui" font-size="7" font-weight="900" fill="#38bdf8" text-anchor="middle">★★★</text>
  </g>

  <!-- Silver Cryo Bullets (Bottom-Right) -->
  <g transform="translate(390, 340) rotate(22)">
    <rect x="0" y="15" width="12" height="42" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <polygon points="0,15 6,0 12,15" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <rect x="18" y="10" width="12" height="42" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
    <polygon points="18,10 24,-5 30,10" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <rect x="-4" y="26" width="38" height="15" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Inner Bezel Ring -->
  <circle cx="250" cy="250" r="172" fill="none" stroke="#1e293b" stroke-width="4"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
</svg>