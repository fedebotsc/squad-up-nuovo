<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="champBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a02"/>
      <stop offset="35%" stop-color="#2a1604"/>
      <stop offset="70%" stop-color="#120801"/>
      <stop offset="100%" stop-color="#050300"/>
    </linearGradient>
    <linearGradient id="champGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="fireFlare" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <pattern id="tacHexGold" width="24" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 7 L 24 0 L 24 13 L 12 20 L 0 13 Z" fill="none" stroke="rgba(234,179,8,0.12)" stroke-width="0.8"/>
    </pattern>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#champBg)"/>
  <rect width="1200" height="420" fill="url(#tacHexGold)"/>

  <!-- Horizon Firestorm & Sunset Glow -->
  <rect y="200" width="1200" height="220" fill="url(#fireFlare)" opacity="0.35"/>
  <circle cx="600" cy="200" r="180" fill="rgba(234,179,8,0.15)" filter="url(#goldGlow)"/>

  <!-- Exfil Extraction Helicopter in Sunset Center -->
  <g transform="translate(600, 115) scale(0.9)">
    <!-- Main rotor -->
    <line x1="-190" y1="0" x2="190" y2="0" stroke="#fde047" stroke-width="4" opacity="0.8"/>
    <!-- Fuselage -->
    <ellipse cx="0" cy="25" rx="85" ry="30" fill="#1c0f03" stroke="#ca8a04" stroke-width="2"/>
    <!-- Cockpit glass reflection -->
    <path d="M -75 22 Q -40 10 -20 22 L -30 35 Q -60 30 -75 22 Z" fill="#fef08a" opacity="0.8"/>
    <!-- Tail boom -->
    <path d="M 75 25 L 200 12 L 205 -5 L 180 22 Z" fill="#1c0f03" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="205" y1="-25" x2="205" y2="35" stroke="#fde047" stroke-width="2.5"/>
    <!-- Winch line & Extraction Hook -->
    <line x1="-15" y1="55" x2="-15" y2="120" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="-15" cy="120" r="4" fill="#fef08a"/>
  </g>

  <!-- Golden Laurel Wreaths Left & Right -->
  <g transform="translate(200, 190) scale(1.1)" stroke="url(#champGold)" stroke-width="2" fill="none">
    <path d="M 0,-80 C -50,-50 -60,20 0,80"/>
    <!-- Leaves -->
    <polygon points="-15,-65 -25,-75 -10,-80" fill="#facc15"/>
    <polygon points="-30,-40 -45,-45 -28,-55" fill="#facc15"/>
    <polygon points="-40,-10 -55,-12 -38,-25" fill="#facc15"/>
    <polygon points="-38,20 -52,22 -35,10" fill="#facc15"/>
    <polygon points="-25,50 -38,55 -22,40" fill="#facc15"/>
    <!-- Stars -->
    <text x="-4" y="8" font-family="'Impact'" font-size="28" fill="#fef08a" text-anchor="middle" stroke="none">★</text>
  </g>

  <g transform="translate(1000, 190) scale(-1.1, 1.1)" stroke="url(#champGold)" stroke-width="2" fill="none">
    <path d="M 0,-80 C -50,-50 -60,20 0,80"/>
    <polygon points="-15,-65 -25,-75 -10,-80" fill="#facc15"/>
    <polygon points="-30,-40 -45,-45 -28,-55" fill="#facc15"/>
    <polygon points="-40,-10 -55,-12 -38,-25" fill="#facc15"/>
    <polygon points="-38,20 -52,22 -35,10" fill="#facc15"/>
    <polygon points="-25,50 -38,55 -22,40" fill="#facc15"/>
    <text x="-4" y="8" font-family="'Impact'" font-size="28" fill="#fef08a" text-anchor="middle" stroke="none">★</text>
  </g>

  <!-- Central Title & Warzone Champion Insignia -->
  <g transform="translate(600, 220)">
    <!-- Top Subhead -->
    <text x="0" y="-30" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#fef08a" letter-spacing="6" text-anchor="middle">
      CALL OF DUTY: WARZONE
    </text>
    <!-- Big Title -->
    <text x="0" y="32" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle" filter="url(#goldGlow)">
      WARZONE CHAMPION
    </text>
    <text x="0" y="74" font-family="'Impact', sans-serif" font-size="30" font-weight="900" fill="url(#champGold)" letter-spacing="8" text-anchor="middle">
      #1 VICTORY EXFIL
    </text>
    <text x="0" y="100" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#facc15" letter-spacing="5" text-anchor="middle">
      LAST OPERATOR STANDING // SUPREME GLORY
    </text>
  </g>

  <!-- Bottom Tactical HUD Ribbon -->
  <g transform="translate(0, 370)">
    <polygon points="60,0 1140,0 1110,40 90,40" fill="#180e03" stroke="url(#champGold)" stroke-width="2"/>
    <polygon points="75,10 95,10 85,30 65,30" fill="#facc15"/>
    <polygon points="98,10 118,10 108,30 88,30" fill="#facc15"/>
    <text x="135" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#fef08a" letter-spacing="2">
      CALL OF DUTY
    </text>
    <text x="600" y="25" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">
      SURVIVE  •  LOOT  •  WIN
    </text>
    <text x="1035" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#facc15" letter-spacing="2">
      WARZONE
    </text>
    <polygon points="1075,10 1095,10 1085,30 1065,30" fill="#facc15"/>
    <polygon points="1098,10 1118,10 1108,30 1088,30" fill="#facc15"/>
  </g>
</svg>