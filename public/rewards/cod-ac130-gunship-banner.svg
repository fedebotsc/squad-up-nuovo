<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="ac130Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180407"/>
      <stop offset="35%" stop-color="#2a060d"/>
      <stop offset="70%" stop-color="#140205"/>
      <stop offset="100%" stop-color="#080102"/>
    </linearGradient>
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="amberBlast" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="redAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#ac130Bg)"/>
  <rect y="180" width="1200" height="240" fill="url(#amberBlast)" opacity="0.4"/>

  <!-- Gunship AC-130 Silhouette Left Top -->
  <g transform="translate(220, 110) scale(0.85)">
    <!-- Main Wings -->
    <polygon points="-160,0 160,0 140,25 -140,25" fill="#080103" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Engines 4x -->
    <rect x="-120" y="-8" width="16" height="38" rx="3" fill="#26040a"/>
    <rect x="-70" y="-8" width="16" height="38" rx="3" fill="#26040a"/>
    <rect x="54" y="-8" width="16" height="38" rx="3" fill="#26040a"/>
    <rect x="104" y="-8" width="16" height="38" rx="3" fill="#26040a"/>
    <!-- Fuselage -->
    <ellipse cx="0" cy="10" rx="35" ry="110" transform="rotate(90 0 10)" fill="#080103" stroke="#ef4444" stroke-width="2"/>
    <!-- 105mm Howitzer barrel poking out -->
    <rect x="-90" y="30" width="10" height="45" rx="2" transform="rotate(-30 -90 30)" fill="#ef4444" filter="url(#redAura)"/>
  </g>

  <!-- Giant Gunship Targeting Reticle & Crosshairs -->
  <g transform="translate(750, 190)" stroke="#ef4444" stroke-width="1.5" fill="none">
    <circle cx="0" cy="0" r="110" stroke-dasharray="8,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" stroke-dasharray="14,10"/>
    <circle cx="0" cy="0" r="12"/>
    <circle cx="0" cy="0" r="3" fill="#ef4444"/>
    <!-- Crosshairs -->
    <line x1="-150" y1="0" x2="-20" y2="0"/>
    <line x1="20" y1="0" x2="150" y2="0"/>
    <line x1="0" y1="-150" x2="0" y2="-20"/>
    <line x1="0" y1="20" x2="0" y2="150"/>
    <!-- Stencil Telemetry -->
    <text x="30" y="-90" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#fca5a5" stroke="none">105MM HE // READY</text>
    <text x="30" y="-70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#ef4444" stroke="none">ELEV: +34.2° // AZM: 198°</text>
    <text x="-135" y="110" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900" fill="#ef4444" stroke="none">FLIR: WHITE-HOT</text>
  </g>

  <!-- Explosions & Ground Impact -->
  <g transform="translate(1000, 260)">
    <circle cx="0" cy="0" r="45" fill="#f97316" filter="url(#redAura)"/>
    <circle cx="0" cy="0" r="22" fill="#fef08a"/>
    <polygon points="-40,10 -15,-60 10,-20 40,-70 60,10" fill="#ef4444" opacity="0.7"/>
  </g>

  <!-- Big Title: AC-130 GUNSHIP // DEATH FROM ABOVE -->
  <g transform="translate(380, 220)">
    <text x="0" y="-50" font-family="'Impact', sans-serif" font-size="24" font-weight="900" fill="#f87171" letter-spacing="5">
      CALL OF DUTY: WARZONE
    </text>
    <text x="0" y="15" font-family="'Impact', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="3" filter="url(#redAura)">
      AC-130 GUNSHIP
    </text>
    <text x="0" y="60" font-family="'Impact', sans-serif" font-size="32" font-weight="900" fill="#f87171" letter-spacing="6">
      DEATH FROM ABOVE
    </text>
    <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#fca5a5" letter-spacing="4">
      KILLSTREAK CONFIRMED // TOTAL AIR DOMINANCE
    </text>
  </g>

  <!-- Bottom Tactical Ribbon -->
  <g transform="translate(0, 370)">
    <polygon points="60,0 1140,0 1110,40 90,40" fill="#1f0408" stroke="#ef4444" stroke-width="2"/>
    <polygon points="75,10 95,10 85,30 65,30" fill="#ef4444"/>
    <polygon points="98,10 118,10 108,30 88,30" fill="#ef4444"/>
    <text x="135" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#fca5a5" letter-spacing="2">
      CALL OF DUTY
    </text>
    <text x="600" y="25" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="6" text-anchor="middle">
      SURVIVE  •  LOOT  •  WIN
    </text>
    <text x="1035" y="26" font-family="'Impact', sans-serif" font-size="16" font-weight="900" fill="#ef4444" letter-spacing="2">
      WARZONE
    </text>
    <polygon points="1075,10 1095,10 1085,30 1065,30" fill="#ef4444"/>
    <polygon points="1098,10 1118,10 1108,30 1088,30" fill="#ef4444"/>
  </g>
</svg>